<div class="users-container">


  <div class="header">
    <h2>Manage Problems</h2>

    <button class="dashboard-btn" (click)="openDashboard()">
      Dashboard
    </button>
  </div>
  <br>
  <h3>Total Records: {{ problems.length }}</h3>
  <table *ngIf="problems.length > 0">

    <thead>
      <tr>
        <!-- <th>ID</th> -->
        <th>User</th>
        <th>Phone</th>
        <th>Problem</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of problems">

        <!-- <td>{{ p.id }}</td> -->
        <td>{{ p.userName }}</td>
        <td>{{ p.phone }}</td>
        <td>{{ p.problemDescription }}</td>
        <td>{{ p.status }}</td>

        <td>
          <button
            class="start-btn"
            *ngIf="p.status?.toLowerCase() === 'waiting'"
            (click)="start(p.id)">
            Start
          </button>

          <button
            class="resolve-btn"
            *ngIf="p.status?.toLowerCase() === 'serving'"
            (click)="resolve(p.id)">
            Resolve
          </button>

          <button
            class="delete-btn"
            (click)="remove(p.id)">
            Delete
          </button>
        </td>

      </tr>
    </tbody>

  </table>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 TechRescue Service Center | All Rights Reserved</p>
  </footer>

</div>
