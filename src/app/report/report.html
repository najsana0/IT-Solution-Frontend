
<div class="main-container">

    <div class="left-section">

        <div class="overlay">

            <h1>TechRescue</h1>

            <h2>We Repair.<br>You Relax.</h2>

            <p>
                Professional repair services for Mobile, Laptop,
                Desktop and Tablet devices.
            </p>

            <div class="features">
                <div>✓ Expert Technicians</div>
                <div>✓ Fast Service</div>
                <div>✓ Affordable Pricing</div>
                <div>✓ Trusted Support</div>
            </div>

        </div>

    </div>

    <div class="report-container">

        <h2>Service Request Form</h2>

        <label>Name</label>
        <input type="text" name="userName" [(ngModel)]="problem.userName" placeholder="Enter Your Name">

        <label>Contact Number</label>
        <input type="tel" name="phone" [(ngModel)]="problem.phone" placeholder="Enter Contact Number">

        <label>Device Type</label>
        <select>
            <option>Select Device Type</option>
            <option>Mobile</option>
            <option>Laptop</option>
            <option>Desktop</option>
            <option>Tablet</option>
            <option>Television</option>

        </select>

        <label>Problem Description</label>
        <textarea rows="5" name="problemDescription" [(ngModel)]="problem.problemDescription" placeholder="Describe the Problem"></textarea>

        <button type="button" (click)="submit()">
             Submit Request
            </button>
    </div>

</div>
